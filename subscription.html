<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Varisanghya - HIHSM</title>
    
    <!-- Design System -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Fredoka:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    
    <!-- HTML2Canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- React & Firebase -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.294.0",
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
    </script>

    <style>
        :root { --primary: #0f766e; --bg: #f8fafc; }
        body { font-family: 'Quicksand', sans-serif; background-color: var(--bg); color: #334155; overscroll-behavior-y: none; }
        h1, h2, h3, h4, .brand-font { font-family: 'Fredoka', sans-serif; }
        .serif-font { font-family: 'Playfair Display', serif; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.8); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (max-width: 768px) {
            .mobile-card { box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; border-radius: 1rem; }
        }
        @media print {
            .no-print { display: none !important; }
            body { background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        }
        #debug-error { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; color: #dc2626; z-index: 9999; padding: 2rem; text-align: center; }
    </style>
</head>
<body class="antialiased">
    <div id="root" class="min-h-[100dvh] flex flex-col items-center justify-center">
        <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-600 mb-4"></div>
        <h2 class="text-xl font-bold text-slate-600">Loading App...</h2>
    </div>

    <div id="debug-error"><h2 class="text-2xl font-bold">Error</h2><p id="error-text"></p><button onclick="location.reload()" class="mt-4 px-4 py-2 bg-teal-600 text-white rounded">Reload</button></div>
    <script>window.onerror = function(m,s,l){ document.getElementById('root').style.display='none'; document.getElementById('debug-error').style.display='block'; document.getElementById('error-text').innerText=`${m} (Line ${l})`; console.error(m); };</script>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { initializeApp } from 'firebase/app';
        import { getFirestore, collection, addDoc, query, onSnapshot, doc, updateDoc, deleteDoc, serverTimestamp, where, getDocs, initializeFirestore } from 'firebase/firestore';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { Search, Plus, User, Users, Printer, CreditCard, X, Trash2, ChevronRight, LayoutGrid, Hash, UserPlus, Download, Upload, TrendingUp, TrendingDown, IndianRupee, Activity, Edit2, MinusCircle, Cloud, AlertTriangle, Save, Home, FileText, Calendar, Wallet, History, MessageCircle, Share2, ImageDown, PieChart, FileSpreadsheet, Menu, ArrowLeft, Bell } from 'lucide-react';

        const firebaseConfig = {
            apiKey: "AIzaSyARMtUmA4fxEr4jwHpcMxMXNGifKLKzfn0",
            authDomain: "varismnkya.firebaseapp.com",
            projectId: "varismnkya",
            storageBucket: "varismnkya.firebasestorage.app",
            messagingSenderId: "211429098532",
            appId: "1:211429098532:web:0ca29381411512c17f44b1"
        };

        let app, auth, db;
        try { 
            app = initializeApp(firebaseConfig); 
            auth = getAuth(app); 
            db = initializeFirestore(app, { experimentalForceLongPolling: true });
        } catch (e) { console.error(e); }

        const generateId = () => Math.random().toString(36).substr(2, 9);
        const CLASS_OPTIONS = Array.from({length: 12}, (_, i) => i + 1);

        function VarisanghyaApp() {
            const [user, setUser] = useState(null);
            const [families, setFamilies] = useState([]);
            const [expenses, setExpenses] = useState([]);
            const [loading, setLoading] = useState(true);
            const [importLoading, setImportLoading] = useState(false);
            const [view, setView] = useState('dashboard');
            const [selectedFamily, setSelectedFamily] = useState(null);
            
            const [showReceipt, setShowReceipt] = useState(false);
            const [currentReceipt, setCurrentReceipt] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [errorMsg, setErrorMsg] = useState(null);
            const [editFamilyMode, setEditFamilyMode] = useState(false);
            const [editingStudentId, setEditingStudentId] = useState(null);
            const [createStudentsList, setCreateStudentsList] = useState([{ id: 'init', studentName: '', regNo: '', year: new Date().getFullYear(), studentClass: '' }]);
            
            // Dashboard & Filters
            const [reportMonth, setReportMonth] = useState(new Date().toISOString().slice(0, 7));
            const [dashboardMode, setDashboardMode] = useState('month'); 
            const [homeFilter, setHomeFilter] = useState('all'); 
            
            const [showExpenseModal, setShowExpenseModal] = useState(false);
            const [showPaymentModal, setShowPaymentModal] = useState(false); 
            const [editingPayment, setEditingPayment] = useState(null);
            
            const [isSidebarOpen, setIsSidebarOpen] = useState(false);
            const [madrsaName, setMadrsaName] = useState('HIHSM');
            const fileInputRef = useRef(null);

            useEffect(() => {
                const localData = localStorage.getItem('hihsm_data_ultimate');
                if (localData) { try { const p = JSON.parse(localData); if (p.settings?.name) setMadrsaName(p.settings.name); } catch(e){} }
                if (!auth) return;
                const unsub = onAuthStateChanged(auth, u => { setUser(u); if (!u) signInAnonymously(auth).catch(e => { setErrorMsg(e.message); setLoading(false); }); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user || !db) return;
                try {
                    const uF = onSnapshot(collection(db, 'families'), s => { setFamilies(s.docs.map(d => ({id:d.id,...d.data()}))); setLoading(false); }, err => { setErrorMsg("Connection lost. Retrying..."); setLoading(false); });
                    const uE = onSnapshot(collection(db, 'expenses'), s => { setExpenses(s.docs.map(d => ({id:d.id,...d.data()}))); });
                    return () => { uF(); uE(); };
                } catch (e) { setErrorMsg(e.message); setLoading(false); }
            }, [user]);

            // Stats
            const stats = useMemo(() => {
                let fams=families.length, studs=0, rev=0, pend=0, rec=[], exp=0;
                families.forEach(f => {
                    if (f.students) studs += f.students.length;
                    if (f.pendingBalance) pend += Number(f.pendingBalance) || 0;
                    if (f.payments) f.payments.forEach(p => { 
                        if (!p.date) return;
                        if (dashboardMode === 'month' && !p.date.startsWith(reportMonth)) return;
                        rev += Number(p.amount)||0; 
                        rec.push({...p, type:'income', familyName:f.guardianName, cardNo:f.familyRegNo, studentName:'Family', phone:f.phone}); 
                    });
                });
                expenses.forEach(e => {
                    if (!e.date) return;
                    if (dashboardMode === 'month' && !e.date.startsWith(reportMonth)) return;
                    exp += Number(e.amount)||0;
                });
                return { fams, studs, rev, expTotal: exp, netBalance: rev-exp, pendingTotal: pend, recent: rec.sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,5) };
            }, [families, expenses, dashboardMode, reportMonth]);

            const monthlyStats = useMemo(() => {
                let inc=0, exp=0, trs=[];
                families.forEach(f => f.payments?.forEach(p => { 
                    if(p.date && p.date.startsWith(reportMonth)) { 
                        inc+=Number(p.amount)||0; 
                        trs.push({id: p.id, date:p.date, desc:`${f.guardianName} (#${f.familyRegNo})`, type:'Income', amount:p.amount, isExpense:false}); 
                    } 
                }));
                expenses.forEach(e => { 
                    if(e.date && e.date.startsWith(reportMonth)) { 
                        exp+=Number(e.amount)||0; 
                        trs.push({id:e.id, date:e.date, desc:e.description, type:'Expense', amount:e.amount, isExpense:true}); 
                    } 
                });
                return { income: inc, expense: exp, net: inc-exp, transactions: trs.sort((a,b) => new Date(b.date)-new Date(a.date)) };
            }, [families, expenses, reportMonth]);

            const filteredFamilies = useMemo(() => {
                let d = families;
                if (homeFilter === 'due') { d = d.filter(f => Number(f.pendingBalance) > 0); }
                if (searchTerm) { const q = searchTerm.toLowerCase(); d = d.filter(f => f.guardianName?.toLowerCase().includes(q) || f.familyRegNo?.toString().includes(q) || f.students?.some(s => s.studentName.toLowerCase().includes(q))); }
                return [...d].sort((a,b) => (a.familyRegNo?.toString()||'').localeCompare(b.familyRegNo?.toString()||'', undefined, {numeric:true, sensitivity:'base'}));
            }, [families, searchTerm, homeFilter]);

            // Handlers
            const handlePayment = async (e) => { 
                e.preventDefault(); const fd=new FormData(e.target); const amt=Number(fd.get('amt')); 
                let updatedPayments = [...(selectedFamily.payments||[])];
                let currentPending = Number(selectedFamily.pendingBalance) || 0;

                if (editingPayment) {
                    currentPending += Number(editingPayment.amount); 
                    updatedPayments = updatedPayments.map(p => p.id === editingPayment.id ? { ...p, amount: amt, month: fd.get('mon'), receiptNo: fd.get('rec'), date: fd.get('date') } : p);
                } else {
                    const pay={id:generateId(), amount:amt, month:fd.get('mon'), receiptNo:fd.get('rec'), date:fd.get('date')};
                    updatedPayments.push(pay);
                }
                const newPending = Math.max(0, currentPending - amt);
                const allStu=selectedFamily.students?.map(s=>s.studentName).join(', ')||'N/A';
                await updateDoc(doc(db,'families',selectedFamily.id),{payments:updatedPayments, pendingBalance:newPending});
                const updatedFamily = {...selectedFamily, payments:updatedPayments, pendingBalance:newPending};
                setSelectedFamily(updatedFamily);
                if (!editingPayment) {
                    setCurrentReceipt({amount:amt, month:fd.get('mon'), receiptNo:fd.get('rec'), date:fd.get('date'), studentNames:allStu, guardianName:selectedFamily.guardianName, familyRegNo:selectedFamily.familyRegNo, pendingBalance:newPending});
                    setShowReceipt(true);
                } else { alert("Payment Updated!"); }
                setShowPaymentModal(false); setEditingPayment(null);
            };

            const openEditPayment = (pay) => { setEditingPayment(pay); setShowPaymentModal(true); };
            const handleDeletePayment = async (pid) => { 
                if(!confirm("Delete this receipt? Balance will be adjusted.")) return;
                const payToDelete = selectedFamily.payments.find(p => p.id === pid);
                if(!payToDelete) return;
                const updated = (selectedFamily.payments||[]).filter(p=>p.id!==pid);
                const newPending = (Number(selectedFamily.pendingBalance)||0) + Number(payToDelete.amount);
                await updateDoc(doc(db,'families',selectedFamily.id),{payments:updated, pendingBalance: newPending}); 
                setSelectedFamily({...selectedFamily, payments:updated, pendingBalance: newPending}); 
            };
            
            // CRUD
            const handleCreateFamily = async (e) => { e.preventDefault(); const fd=new FormData(e.target); const s=createStudentsList.filter(x=>x.studentName); await addDoc(collection(db,'families'),{guardianName:fd.get('guardianName'), familyRegNo:fd.get('familyRegNo'), phone:fd.get('phone'), pendingBalance:fd.get('pendingBalance'), students:s, payments:[], createdAt:serverTimestamp()}); setView('home'); setCreateStudentsList([{id:'init',studentName:'',regNo:'',year:new Date().getFullYear(),studentClass:''}]); };
            const handleUpdateFamily = async (e) => { e.preventDefault(); const fd=new FormData(e.target); const u={guardianName:fd.get('gName'), familyRegNo:fd.get('cNo'), phone:fd.get('phone'), pendingBalance:fd.get('pBal')}; await updateDoc(doc(db,'families',selectedFamily.id),u); setEditFamilyMode(false); setSelectedFamily({...selectedFamily,...u}); };
            const handleAddStudent = async (e) => { e.preventDefault(); const fd=new FormData(e.target); const n={id:generateId(), studentName:fd.get('sName'), regNo:fd.get('sReg'), year:fd.get('sYear'), studentClass:fd.get('sClass')}; const u=[...(selectedFamily.students||[]),n]; await updateDoc(doc(db,'families',selectedFamily.id),{students:u}); setSelectedFamily({...selectedFamily,students:u}); e.target.reset(); };
            const handleEditStudent = async (e) => { e.preventDefault(); const fd=new FormData(e.target); const u=selectedFamily.students.map(s=>s.id===editingStudentId?{...s, studentName:fd.get('sName'), regNo:fd.get('sReg'), year:fd.get('sYear'), studentClass:fd.get('sClass')}:s); await updateDoc(doc(db,'families',selectedFamily.id),{students:u}); setSelectedFamily({...selectedFamily,students:u}); setEditingStudentId(null); };
            const handleDeleteStudent = async (sid) => { if(confirm("Delete?")) { const u=selectedFamily.students.filter(s=>s.id!==sid); await updateDoc(doc(db,'families',selectedFamily.id),{students:u}); setSelectedFamily({...selectedFamily,students:u}); } };
            const handleDeleteFamily = async () => { if(confirm("Delete Account?")) { await deleteDoc(doc(db,'families',selectedFamily.id)); setView('home'); setSelectedFamily(null); } };
            const handleAddExpense = async (e) => { e.preventDefault(); const fd=new FormData(e.target); await addDoc(collection(db,'expenses'),{description:fd.get('desc'),amount:fd.get('amount'),date:fd.get('date'),category:fd.get('cat'),createdAt:serverTimestamp()}); setShowExpenseModal(false); };
            const handleDeleteExpense = async (id) => { if(confirm("Delete?")) await deleteDoc(doc(db,'expenses',id)); };

            const handleWhatsAppReminder = (f) => {
                const msg = `*Assalamu Alaikum*\nDear Parent (${f.guardianName}),\n\nThis is a gentle reminder regarding the pending Varisanghya balance.\n*Due Amount: ₹${f.pendingBalance}*\n\nPlease pay at your earliest convenience.\n\n-${madrsaName}`;
                const clean = f.phone ? f.phone.replace(/\D/g, '') : '';
                const url = clean.length>=10 ? `https://wa.me/${clean.length===10?'91'+clean:clean}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
                window.open(url, '_blank');
            };
            const handleWhatsAppShare = async (r, ph) => {
                const el = document.getElementById('receipt-print'); if(!el) return;
                const msg = `*${madrsaName} Receipt*\nRcpt: ${r.receiptNo}\nDate: ${r.date}\nStudents: ${r.studentNames}\nAmt: ₹${r.amount}\nThank you!`;
                const clean = ph ? ph.replace(/\D/g, '') : '';
                const url = clean.length>=10 ? `https://wa.me/${clean.length===10?'91'+clean:clean}?text=${encodeURIComponent(msg)}` : `https://wa.me/?text=${encodeURIComponent(msg)}`;
                try {
                    const canvas = await window.html2canvas(el, {scale:2, backgroundColor:'#fff', width: el.offsetWidth, height: el.offsetHeight});
                    canvas.toBlob(async (blob) => {
                        if(!blob){ window.open(url, '_blank'); return; }
                        const f = new File([blob], `Receipt.png`, {type:'image/png'});
                        if(navigator.canShare && navigator.canShare({files:[f]})) { try { await navigator.share({files:[f], title:'Receipt', text:msg}); } catch(e){ if(e.name!=='AbortError') window.open(url, '_blank'); } } else { const l = document.createElement('a'); l.download = `Receipt.png`; l.href = canvas.toDataURL('image/png'); l.click(); setTimeout(() => window.open(url, '_blank'), 500); }
                    }, 'image/png');
                } catch(e) { window.open(url, '_blank'); }
            };
            const handleDownloadImage = async () => { const el=document.getElementById('receipt-print'); if(el){ const c=await html2canvas(el,{scale:2,backgroundColor:'#fff'}); const l=document.createElement('a'); l.download='Receipt.png'; l.href=c.toDataURL('image/png'); l.click(); } };
            
            const handleExport = () => { let c="Card,Name,Phone,Pending,Student,Class,Reg\n"; families.forEach(f=>{ const p=`${f.familyRegNo},${f.guardianName},${f.phone||''},${f.pendingBalance||0}`; if(!f.students?.length) c+=`${p},,,\n`; else f.students.forEach(s=>c+=`${p},${s.studentName},${s.studentClass},${s.regNo}\n`); }); const l=document.createElement('a'); l.href="data:text/csv;charset=utf-8,"+encodeURI(c); l.download="data.csv"; l.click(); };
            const handleDownloadReport = (t) => { let c="Date,Type,Desc,Amt\n"; (t==='monthly'?monthlyStats.transactions:[]).forEach(r=>c+=`${r.date},${r.type},"${r.desc}",${r.amount}\n`); const l=document.createElement('a'); l.href="data:text/csv;charset=utf-8,"+encodeURI(c); l.download=`report_${t}.csv`; l.click(); };
            const handleTemplateDownload = () => { const l=document.createElement('a'); l.href="data:text/csv;charset=utf-8,"+encodeURI("Card,Name,Phone,Pending,Student,Class,Reg,Year\n101,Ali,98765,0,Fathima,5,A1,2024"); l.download="template.csv"; l.click(); };
            const handleImport = (e) => { const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=async(ev)=>{ await processImport(ev.target.result); e.target.value=''; }; r.readAsText(f); } };
            const processImport = async (csv) => { setImportLoading(true); try{ const l=csv.split('\n').slice(1); const m=new Map(); l.forEach(x=>{ const c=x.split(','); if(c.length>1){ const id=c[0].trim(); if(!m.has(id)) m.set(id,{familyRegNo:id, guardianName:c[1], phone:c[2], pendingBalance:c[3], students:[], payments:[]}); if(c[4]) m.get(id).students.push({id:generateId(), studentName:c[4], studentClass:c[5], regNo:c[6], year:c[7]}); } }); for(const d of m.values()){ const q=query(collection(db,'families'),where('familyRegNo','==',d.familyRegNo)); const s=await getDocs(q); if(s.empty) await addDoc(collection(db,'families'),{...d, createdAt:serverTimestamp()}); } alert("Imported!"); }catch(e){alert("Error");} setImportLoading(false); };

            if(loading) return <div className="h-[100dvh] flex items-center justify-center text-teal-600"><Activity className="animate-spin mr-2"/> Loading...</div>;

            return (
                <div className="flex flex-col h-[100dvh] bg-slate-50 text-slate-800 font-sans overflow-hidden">
                    {isSidebarOpen && <div className="fixed inset-0 bg-black/50 z-30 md:hidden backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)}></div>}
                    <aside className={`fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 transform transition-transform duration-300 ease-in-out md:translate-x-0 md:static md:h-[100dvh] ${isSidebarOpen ? 'translate-x-0' : '-translate-x-full'}`}>
                        <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                            <div className="flex items-center gap-3"><div className="w-10 h-10 bg-teal-600 rounded-xl flex items-center justify-center text-white font-bold shadow-lg">VS</div><div><h1 className="font-bold text-lg leading-none">Varisanghya</h1><p className="text-xs text-slate-400 font-bold uppercase">{madrsaName}</p></div></div>
                            <button onClick={()=>setIsSidebarOpen(false)} className="md:hidden text-slate-400"><X size={20}/></button>
                        </div>
                        <nav className="p-4 space-y-2 flex-1"><button onClick={()=>{setView('dashboard');setIsSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition ${view==='dashboard'?'bg-teal-50 text-teal-700':'hover:bg-slate-50 text-slate-500'}`}><LayoutGrid size={18}/> Dashboard</button><button onClick={()=>{setView('home');setIsSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition ${view==='home'||view==='details'?'bg-teal-50 text-teal-700':'hover:bg-slate-50 text-slate-500'}`}><Users size={18}/> Accounts</button><button onClick={()=>{setView('add');setIsSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition ${view==='add'?'bg-teal-50 text-teal-700':'hover:bg-slate-50 text-slate-500'}`}><Plus size={18}/> New Family</button><button onClick={()=>{setShowExpenseModal(true);setIsSidebarOpen(false)}} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm transition text-slate-500 hover:bg-slate-50`}><MinusCircle size={18}/> Add Expense</button><a href="admin.html" className="w-full flex items-center gap-3 px-4 py-3 rounded-xl font-bold text-sm text-slate-500 hover:bg-slate-50 transition mt-8"><Home size={18}/> Admin</a></nav>
                    </aside>

                    <main className="flex-1 flex flex-col h-full w-full md:pl-64 relative">
                        <header className="flex-shrink-0 bg-white border-b border-slate-200 px-4 py-3 flex justify-between items-center z-10 sticky top-0"><div className="flex items-center gap-3"><button className="md:hidden p-2 text-slate-600" onClick={() => setIsSidebarOpen(true)}><Menu size={24}/></button><h2 className="text-lg font-bold text-slate-800 brand-font flex items-center gap-2">{view === 'details' && <button onClick={()=>setView('home')}><ArrowLeft size={20}/></button>}{view==='dashboard'?'Overview':view==='home'?'Accounts':view==='add'?'Register':'Details'}</h2></div><div className="flex gap-2">{view === 'home' && <><input type="file" ref={fileInputRef} onChange={handleImport} className="hidden" accept=".csv" /><button onClick={() => fileInputRef.current.click()} disabled={importLoading} className="hidden md:flex bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-sm font-bold items-center gap-2"><Upload size={14}/> Import</button><button onClick={handleExport} className="bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2"><Download size={14}/> <span className="hidden md:inline">Export</span></button></>}</div></header>

                        <div className="flex-1 overflow-y-auto p-4 pb-24 md:p-8 md:pb-8">
                            {view === 'dashboard' && <div className="space-y-6 animate-in fade-in"><div className="flex bg-slate-200 p-1 rounded-lg w-fit mx-auto md:mx-0"><button onClick={()=>setDashboardMode('month')} className={`px-4 py-1 rounded-md text-sm font-bold transition ${dashboardMode==='month'?'bg-white shadow text-teal-700':'text-slate-500'}`}>Month</button><button onClick={()=>setDashboardMode('year')} className={`px-4 py-1 rounded-md text-sm font-bold transition ${dashboardMode==='year'?'bg-white shadow text-teal-700':'text-slate-500'}`}>Year</button></div><div className="grid grid-cols-2 lg:grid-cols-4 gap-3"><div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><p className="text-xs font-bold text-slate-400 uppercase mb-1">Income</p><h3 className="text-xl font-black text-slate-800">₹{stats.rev.toLocaleString()}</h3></div><div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><p className="text-xs font-bold text-slate-400 uppercase mb-1">Expense</p><h3 className="text-xl font-black text-slate-800">₹{stats.expTotal.toLocaleString()}</h3></div><div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><p className="text-xs font-bold text-slate-400 uppercase mb-1">Net</p><h3 className={`text-xl font-black ${stats.netBalance>=0?'text-teal-600':'text-red-600'}`}>₹{stats.netBalance.toLocaleString()}</h3></div><div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100"><p className="text-xs font-bold text-slate-400 uppercase mb-1">Pending</p><h3 className="text-xl font-black text-slate-800">₹{stats.pendingTotal.toLocaleString()}</h3></div></div><div className="bg-teal-600 text-white p-4 rounded-2xl shadow-lg flex justify-between items-center cursor-pointer active:scale-95 transition" onClick={()=>setShowExpenseModal(true)}><span className="font-bold">Add Expense</span><div className="bg-white/20 p-2 rounded-lg"><MinusCircle size={20}/></div></div></div>}
                            {view === 'home' && <div className="space-y-4 animate-in fade-in"><div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar"><button onClick={()=>setHomeFilter('all')} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border ${homeFilter==='all'?'bg-slate-800 text-white border-slate-800':'bg-white text-slate-600 border-slate-200'}`}>All</button><button onClick={()=>setHomeFilter('due')} className={`px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap border ${homeFilter==='due'?'bg-red-50 text-red-600 border-red-200':'bg-white text-slate-600 border-slate-200'}`}>Pending</button></div><div className="bg-white p-2 rounded-xl shadow-sm border border-slate-200 flex items-center px-3 gap-2"><Search className="text-slate-400" size={18} /><input className="w-full py-2 outline-none text-sm font-medium text-slate-600 placeholder:text-slate-300 bg-transparent" placeholder="Search..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} /></div><div className="space-y-3">{filteredFamilies.map(f => <div key={f.id} onClick={() => { setSelectedFamily(f); setView('details'); }} className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 active:scale-95 transition-transform"><div className="flex justify-between items-start mb-2"><span className="bg-slate-800 text-white px-2 py-0.5 rounded text-xs font-bold">#{f.familyRegNo}</span><div className="flex items-center gap-2">{Number(f.pendingBalance) > 0 && <button onClick={(e)=>{e.stopPropagation();handleWhatsAppReminder(f)}} className="p-1.5 bg-red-100 text-red-600 rounded-full animate-pulse"><Bell size={12}/></button>}{Number(f.pendingBalance) > 0 && <span className="text-[10px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-full border border-red-100">₹{f.pendingBalance}</span>}</div></div><h3 className="font-bold text-base text-slate-800">{f.guardianName}</h3><p className="text-xs text-slate-400 mt-1">{f.students?.map(s=>`${s.studentName} (${s.studentClass})`).join(', ') || 'No Students'}</p></div>)}{filteredFamilies.length === 0 && <div className="text-center py-20 text-slate-400 italic text-sm">No accounts found.</div>}</div></div>}
                            {view === 'add' && <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 animate-in slide-in-from-bottom-8"><h2 className="text-xl font-bold text-slate-800 mb-6">New Family</h2><form onSubmit={handleCreateFamily} className="space-y-4"><div className="space-y-3"><input required name="guardianName" placeholder="Guardian Name" className="w-full p-3 border rounded-xl bg-slate-50 text-sm font-bold outline-none focus:ring-2 focus:ring-teal-200" /><div className="flex gap-2"><input required name="familyRegNo" placeholder="Card No" className="w-1/2 p-3 border rounded-xl bg-slate-50 text-sm outline-none" /><input name="phone" placeholder="Phone" className="w-1/2 p-3 border rounded-xl bg-slate-50 text-sm outline-none" /></div><input name="pendingBalance" type="number" placeholder="Pending Balance (Opt)" className="w-full p-3 border border-red-100 bg-red-50 text-sm outline-none text-red-600 font-bold rounded-xl" /></div><div className="pt-4 border-t border-slate-100"><div className="flex justify-between items-center mb-2"><span className="text-xs font-bold text-slate-400 uppercase">Student</span><button type="button" onClick={() => setCreateStudentsList([...createStudentsList, { studentName: '', regNo: '', year: '', studentClass: '' }])} className="text-xs text-teal-700 font-bold">+ Add</button></div>{createStudentsList.map((s, i) => <div key={i} className="flex gap-2 mb-2"><input placeholder="Name" className="flex-1 p-2 border rounded-lg text-sm" value={s.studentName} onChange={e => {const l=[...createStudentsList]; l[i].studentName=e.target.value; setCreateStudentsList(l)}} /><input placeholder="Cls" className="w-12 p-2 border rounded-lg text-sm" value={s.studentClass} onChange={e => {const l=[...createStudentsList]; l[i].studentClass=e.target.value; setCreateStudentsList(l)}} /></div>)}</div><button className="w-full py-3.5 bg-teal-600 text-white rounded-xl font-bold shadow-lg shadow-teal-200">Create Account</button></form></div>}
                            {view === 'details' && selectedFamily && <div className="space-y-6 animate-in slide-in-from-right-4"><div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-100"><div className="flex justify-between items-start mb-4"><div><h2 className="text-xl font-bold text-slate-800">{selectedFamily.guardianName}</h2><span className="text-xs text-slate-400 font-mono">#{selectedFamily.familyRegNo}</span></div><div className="flex gap-2"><button onClick={()=>setEditFamilyMode(!editFamilyMode)} className="p-2 bg-blue-50 text-blue-500 rounded-lg"><Edit2 size={16}/></button><button onClick={handleDeleteFamily} className="p-2 bg-red-50 text-red-500 rounded-lg"><Trash2 size={16}/></button></div></div>{!editFamilyMode ? <div className="flex flex-col gap-2 bg-slate-50 p-3 rounded-xl mb-4">{selectedFamily.students?.map(s => <div key={s.id} className="text-sm font-bold text-slate-600 flex justify-between"><span>{s.studentName}</span> <span className="text-xs bg-white px-2 rounded border">Cls {s.studentClass}</span></div>)}<div className="border-t border-slate-200 pt-2 mt-1"><form onSubmit={handleAddStudent} className="flex gap-2"><input name="sName" placeholder="New Child" className="flex-1 p-1.5 text-xs border rounded" required /><input name="sClass" placeholder="Cls" className="w-12 p-1.5 text-xs border rounded" required /><button className="bg-slate-800 text-white px-3 rounded text-xs font-bold">Add</button></form></div></div> : <form onSubmit={handleUpdateFamily} className="mb-4 space-y-2 bg-slate-50 p-3 rounded-xl"><input name="gName" defaultValue={selectedFamily.guardianName} className="w-full p-2 border rounded text-sm" /><div className="flex gap-2"><input name="cNo" defaultValue={selectedFamily.familyRegNo} className="w-1/2 p-2 border rounded text-sm" /><input name="phone" defaultValue={selectedFamily.phone} className="w-1/2 p-2 border rounded text-sm" /></div><div className="pt-2"><label className="text-[10px] font-bold text-red-500 uppercase">Pending Due</label><input name="pBal" type="number" defaultValue={selectedFamily.pendingBalance} className="w-full p-2 border border-red-200 rounded text-sm font-bold text-red-600" /></div><button className="w-full bg-blue-600 text-white py-2 rounded text-xs font-bold">Save Changes</button></form>}<button onClick={()=>{setEditingPayment(null); setShowPaymentModal(true)}} className="w-full py-3 bg-teal-600 text-white rounded-xl font-bold shadow-lg flex items-center justify-center gap-2"><CreditCard size={18}/> Pay Now</button><div className="mt-6"><h4 className="text-xs font-bold text-slate-400 uppercase mb-3">History</h4><div className="space-y-2">{selectedFamily.payments?.slice().reverse().map((p, i) => <div key={i} className="flex justify-between items-center p-3 bg-white border border-slate-100 rounded-xl shadow-sm"><div><p className="font-bold text-sm text-slate-700">₹{p.amount}</p><p className="text-xs text-slate-400">{p.month} • {p.date}</p></div><div className="flex gap-2"><button onClick={() => { setCurrentReceipt({...p, studentNames:(selectedFamily.students?.map(s=>s.studentName).join(', ')||'N/A'), guardianName:selectedFamily.guardianName, familyRegNo:selectedFamily.familyRegNo, pendingBalance:selectedFamily.pendingBalance, month:p.month});setShowReceipt(true);}} className="p-2 bg-blue-50 text-blue-600 rounded-lg"><Printer size={16}/></button><button onClick={() => openEditPayment(p)} className="p-2 bg-slate-100 text-slate-600 rounded-lg"><Edit2 size={16}/></button></div></div>)}</div></div></div></div>}
                        </div>
                    </main>

                    {showReceipt && <div className="fixed inset-0 bg-slate-900/90 z-50 flex items-center justify-center p-4"><div className="bg-white w-full max-w-sm rounded-xl overflow-hidden animate-in zoom-in-95 duration-200"><div id="receipt-print" className="p-6 bg-white text-slate-800 text-sm relative"><div className="text-center border-b-2 border-slate-800 pb-4 mb-4"><h2 className="text-xl font-black uppercase tracking-widest">{madrsaName}</h2><p className="text-[10px] font-bold text-slate-400 uppercase">Payment Receipt</p></div><div className="grid grid-cols-2 gap-4 text-xs mb-4"><div><span className="text-slate-400 block">Date</span><span className="font-bold">{currentReceipt.date}</span></div><div className="text-right"><span className="text-slate-400 block">No</span><span className="font-bold">#{currentReceipt.receiptNo}</span></div></div><div className="bg-slate-50 p-3 rounded-lg border border-slate-100 mb-4 space-y-1 text-xs"><div className="flex justify-between"><span className="text-slate-400">ID</span><span className="font-bold">{currentReceipt.familyRegNo}</span></div><div className="flex justify-between"><span className="text-slate-400">Name</span><span className="font-bold truncate max-w-[120px]">{currentReceipt.guardianName}</span></div><div className="flex justify-between pt-1 border-t border-slate-200 mt-1"><span className="text-slate-400">Students</span><span className="font-bold text-right truncate max-w-[120px]">{currentReceipt.studentNames}</span></div><div className="flex justify-between"><span className="text-slate-400">Month</span><span className="font-bold">{currentReceipt.month}</span></div>{Number(currentReceipt.pendingBalance) > 0 && <div className="flex justify-between text-red-500 font-bold pt-1"><span>Due</span><span>₹{currentReceipt.pendingBalance}</span></div>}</div><div className="flex justify-between items-center text-lg font-black border-t-2 border-slate-800 pt-2"><span>Total</span><span>₹{currentReceipt.amount}</span></div></div><div className="p-3 bg-slate-100 flex gap-2"><button onClick={() => setShowReceipt(false)} className="flex-1 py-3 text-slate-500 font-bold rounded-lg bg-white">Close</button><button onClick={() => handleWhatsAppShare(currentReceipt, selectedFamily.phone)} className="flex-1 py-3 bg-green-500 text-white font-bold rounded-lg flex items-center justify-center gap-2"><MessageCircle size={18}/> Share</button></div></div></div>}
                    
                    {(showPaymentModal || showExpenseModal) && <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm"><div className="bg-white w-full max-w-sm rounded-2xl p-6 animate-in slide-in-from-bottom-10"><h3 className="font-bold text-lg mb-4">{showPaymentModal ? (editingPayment ? 'Edit Payment' : 'New Payment') : 'Add Expense'}</h3><form onSubmit={showPaymentModal ? handlePayment : handleAddExpense} className="space-y-3">{showPaymentModal ? <><select name="mon" defaultValue={editingPayment?.month} className="w-full p-3 border rounded-xl bg-white text-sm font-bold">{['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'].map(m=><option key={m}>{m}</option>)}</select><input name="amt" type="number" defaultValue={editingPayment?.amount} required placeholder="Amount (₹)" className="w-full p-3 border rounded-xl text-sm" /><input name="rec" defaultValue={editingPayment?.receiptNo} required placeholder="Rec No" className="w-full p-3 border rounded-xl text-sm" /><input name="date" type="date" defaultValue={editingPayment?.date || new Date().toISOString().split('T')[0]} className="w-full p-3 border rounded-xl text-sm" /></> : <><input name="desc" placeholder="Desc" required className="w-full p-3 border rounded-xl text-sm"/><input name="amount" type="number" placeholder="₹" required className="w-full p-3 border rounded-xl text-sm"/><input name="date" type="date" required defaultValue={new Date().toISOString().split('T')[0]} className="w-full p-3 border rounded-xl text-sm"/></>}<div className="flex gap-2 pt-2"><button className="flex-1 bg-teal-600 text-white py-3 rounded-xl font-bold">Save</button><button type="button" onClick={()=>{setShowPaymentModal(false);setShowExpenseModal(false);setEditingPayment(null)}} className="flex-1 bg-slate-100 py-3 rounded-xl font-bold text-slate-500">Cancel</button></div></form></div></div>}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<VarisanghyaApp />);
    </script>
</body>
</html>
